name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync --frozen --extra dev --extra cpu
      - run: uv run --no-sync ruff check src tests scripts
      - run: uv run --no-sync pyrefly check
      - run: uv run --no-sync pytest
