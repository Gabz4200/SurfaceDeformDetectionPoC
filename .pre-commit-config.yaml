repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check src tests scripts
        language: system
        pass_filenames: false
      - id: pyrefly
        name: pyrefly
        entry: uv run pyrefly check
        language: system
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        pass_filenames: false
      - id: kaggle-upload
        name: kaggle-upload
        entry: uv run python scripts/kaggle_upload.py
        language: system
        pass_filenames: false
        always_run: true
